name: platech_tap_to_pay_release
description: Wrapper Flutter privado para o Platech TapToPay release.
version: 1.0.2
publish_to: none
repository: https://github.com/platech-api/platech-package-public

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: site.platech.taptopay
        pluginClass: PlatechTapToPayFlutterPlugin
