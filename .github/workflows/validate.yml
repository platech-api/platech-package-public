name: Validate public distribution repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate public repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          grep -q 'https://app.platech.site/documents/' README.md
          grep -q 'read:packages' README.md
          grep -q 'platechMavenUser=SEU_USUARIO_GITHUB' README.md
          grep -q 'platechMavenToken=SUA_PAT_CLASSIC' README.md
          test ! -d plugins
          ! grep -E -i '\bios\b|cocoapods|swift package' README.md

      - name: Reject committed credentials
        shell: bash
        run: |
          if git grep -qE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|pla_(prod|sandbox|sand)_[A-Za-z0-9]+|-----BEGIN [A-Z ]*PRIVATE KEY-----'; then
            echo 'Credencial potencial encontrada no repositório público.' >&2
            exit 1
          fi
